# OpenFuse (openfuse-dkms): load snd_usb_audio through a wrapper that falls
# back to the distribution's module if the OpenFuse build cannot be loaded
# (key not enrolled, signature rejected, version mismatch, ...).
# If the wrapper is missing, load the module the normal way.
# Removed together with the package. Do not add other settings here; a file
# with the same name in /etc/modprobe.d would replace this one.
install snd_usb_audio if [ -x /usr/libexec/openfuse/openfuse-modprobe ]; then /usr/libexec/openfuse/openfuse-modprobe $CMDLINE_OPTS; else /sbin/modprobe --ignore-install snd_usb_audio $CMDLINE_OPTS; fi
