# DKMS configuration for OpenFuse: snd-usb-audio with the Arturia MiniFuse
# mixer quirk, rebuilt out of tree for each kernel.
#
# PRE_BUILD prepares the sound/usb sources for ${kernelver} and builds the
# module (build-module.sh), from EXACTLY matching sources only (cache,
# bundled sources/, or Launchpad); non-exact fallbacks are opt-in in
# /etc/openfuse/build.conf. If nothing usable is found or nothing compiles,
# it exits 77, which DKMS reports as "skipped": nothing is installed for
# that kernel, the distribution's snd-usb-audio stays in use, and kernel
# package installation is not affected. MAKE then only confirms the result.
#
# The download cache is /var/cache/openfuse (DKMS recreates its build
# directory for every build).

PACKAGE_NAME="openfuse"
PACKAGE_VERSION="0.1.0"

PRE_BUILD="build-module.sh --dkms ${kernelver} ${kernel_source_dir}"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
# dkms moves the distribution's snd-usb-audio aside when installing;
# put a copy back so the fallback (openfuse-modprobe) can always load it.
POST_INSTALL="dkms-post-install.sh ${kernelver}"

BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="build/${kernelver}/"
# updates/ is searched before kernel/ by depmod, so this copy takes
# precedence over the in-tree module; removing the package restores it.
DEST_MODULE_LOCATION[0]="/updates/dkms"

AUTOINSTALL="yes"
